name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: supervision
          POSTGRES_PASSWORD: supervision
          POSTGRES_DB: supervision
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U supervision -d supervision"
          --health-interval 5s --health-timeout 5s --health-retries 20

      neo4j:
        image: neo4j:5.20.0
        env:
          NEO4J_AUTH: neo4j/supervision123
        ports: ["7687:7687", "7474:7474"]
        options: >-
          --health-cmd "wget -qO- http://localhost:7474/ >/dev/null 2>&1 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30

    env:
      SUPERVISION_DATABASE_URL: postgresql+psycopg://supervision:supervision@127.0.0.1:5432/supervision
      SUPERVISION_NEO4J_URI: bolt://127.0.0.1:7687
      SUPERVISION_NEO4J_PASSWORD: supervision123
      SUPERVISION_LLM_PROVIDER: fake
      SUPERVISION_EMBEDDING_PROVIDER: hash
      SUPERVISION_RERANKER_PROVIDER: score_fusion
      SUPERVISION_LOG_LEVEL: ERROR
      SUPERVISION_JWT_SECRET: ci-secret-not-for-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # CI 不需要本地大模型与 OCR，去掉重型依赖以加速
          grep -v -E "^(sentence-transformers|FlagEmbedding)" requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: 写入示例规范并建立索引
        working-directory: backend
        run: python scripts/seed_data.py

      - name: 单元 + 集成测试
        working-directory: backend
        run: python -m pytest -q --tb=short

      - name: 启动脚本编码契约（BOM / CRLF）
        # 为什么必须守：PowerShell 5.1 读 .ps1 时若无 UTF-8 BOM 会按 GBK 解码，
        # 中文被误解后可能产出 `'` 而提前终结字符串，脚本直接语法崩坏；
        # cmd 读 .bat 还不识别 LF 换行（会把整个文件当一行执行）。
        # 这两类问题在 UTF-8 的编辑器与 CI 终端里都**看不出异常**，
        # 只有实际双击运行才暴露 —— 因此必须在 CI 拦住。
        working-directory: backend
        run: python scripts/check_script_encoding.py

      - name: 路由与 OpenAPI 契约校验
        working-directory: backend
        run: python scripts/smoke_api.py

      - name: 全链路端到端（14 步）
        working-directory: backend
        run: python scripts/e2e_check.py

      - name: 图谱自检
        working-directory: backend
        env:
          SUPERVISION_NEO4J_ENABLED: "true"
        run: python scripts/smoke_graph.py

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        working-directory: frontend
        run: npx vue-tsc --noEmit

      - name: 角色权限矩阵一致性
        # 校验前端镜像的权限表与后端 deps.py 是否一致、各角色菜单是否符合契约、
        # 落地页是否可达（防跳转死循环）。前后端任一侧改了权限而另一侧没跟上，
        # 这一步就会失败 —— 是最关键的一致性防线。
        working-directory: frontend
        run: node scripts/check-role-matrix.mjs

      - name: 生产构建
        working-directory: frontend
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  compose-validate:
    name: Compose 编排校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 compose 文件语法
        working-directory: deploy
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose-infra.yml config -q

  image-build:
    name: 镜像构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备环境文件
        working-directory: deploy
        run: cp .env.example .env

      - uses: docker/setup-buildx-action@v3

      # 为什么不推镜像也要构建：
      # 「CI 全绿」曾掩盖过「Dockerfile 漏 COPY alembic 目录、容器反复重启」
      # 这类问题 —— 本机跑测试完全看不出（本机直接读源码目录），只在镜像里炸。
      # 因此必须在合并前验证镜像真的能构建出来。
      - name: 构建 api 镜像
        working-directory: deploy
        run: docker compose -f docker-compose.yml build api

      - name: 构建 web 镜像
        working-directory: deploy
        run: docker compose -f docker-compose.yml build web

      - name: 校验镜像内迁移脚本齐全
        # alembic 目录缺失会导致容器启动即失败（Path doesn't exist: /app/alembic），
        # 这里显式检查，让失败原因一眼可见而不是等到部署才发现。
        run: |
          IMAGE=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E 'api' | head -1)
          echo "检查镜像：$IMAGE"
          docker run --rm --entrypoint sh "$IMAGE" -c \
            'test -f /app/alembic.ini && test -d /app/alembic && echo "[OK] alembic 已就位"'

  security-scan:
    name: 依赖漏洞扫描
    runs-on: ubuntu-latest
    # 与前端 job 内的报告步骤重复度较高，这里独立成 job 便于单独查看与后续改为阻塞。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 后端依赖扫描（pip-audit）
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip --quiet
          pip install --quiet pip-audit
          pip-audit -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 前端依赖扫描（npm audit）
        continue-on-error: true
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm audit --audit-level=high
